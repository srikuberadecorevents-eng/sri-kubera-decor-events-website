name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel in-progress production deployments when a newer commit is pushed.
# Pull requests each get their own isolated concurrency group so they never
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # CI -- Lint, TypeScript validation, and production build
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript validation
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build
        env:
          # Supply placeholder values so Next.js can evaluate its config at
          # build time without erroring on missing env vars. Real runtime
          # secrets must be configured in Netlify environment variables.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://srikuberadecor.com' }}
          NEXT_PUBLIC_BUSINESS_WHATSAPP: ${{ vars.NEXT_PUBLIC_BUSINESS_WHATSAPP || '917373876879' }}
          NEXT_PUBLIC_BUSINESS_PHONE: ${{ vars.NEXT_PUBLIC_BUSINESS_PHONE || '7373876879' }}
          NEXT_PUBLIC_BUSINESS_PHONE_2: ${{ vars.NEXT_PUBLIC_BUSINESS_PHONE_2 || '9486064769' }}

  # ---------------------------------------------------------------------------
  # DEPLOY -- Netlify production deployment
  # Runs ONLY after the CI job passes AND ONLY on pushes to main (not on PRs).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Netlify CLI
        run: npm install --global netlify-cli

      - name: Deploy to Netlify production
        run: netlify deploy --build --prod --message "Deploy from GitHub Actions (commit ${{ github.sha }})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
